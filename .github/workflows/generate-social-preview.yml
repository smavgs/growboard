name: Generate Growboard Social Preview

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/generate-social-preview.yml"
      - "scripts/generate_social_card.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate 1200x630 baseline JPEG
        run: python scripts/generate_social_card.py

      - name: Verify social card
        run: |
          python - <<'PY'
          from PIL import Image
          p='public/assets/cvai-growboard-social-v3.jpg'
          im=Image.open(p)
          assert im.size == (1200, 630), im.size
          assert im.mode == 'RGB', im.mode
          im.verify()
          print('verified', p)
          PY

      - name: Commit generated social card
        run: |
          git config user.name "Aegis Wizard"
          git config user.email "moneymakergpts@gmail.com"
          git add public/assets/cvai-growboard-social-v3.jpg
          if git diff --cached --quiet; then
            echo "No social-card change to commit"
          else
            git commit -m "Generate approved Growboard social preview card"
            git push origin HEAD:main
          fi
